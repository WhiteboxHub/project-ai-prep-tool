name: Backend CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

permissions:
  contents: read

env:
  WORKING_DIRECTORY: backend

jobs:
  checks:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall backend

      - name: Validate Docker build
        run: docker build -t ai-prep-backend:${{ github.sha }} ./backend

  deploy:
    name: Deploy Backend To Cloud Run
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/backend:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" ./backend
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/backend:${{ github.sha }}
        run: >
          gcloud run deploy ${{ secrets.BACKEND_SERVICE_NAME }}
          --image "$IMAGE_URI"
          --project ${{ secrets.GCP_PROJECT_ID }}
          --region ${{ secrets.GCP_REGION }}
          --platform managed
          --allow-unauthenticated
          --quiet
